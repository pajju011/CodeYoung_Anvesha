<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Anvesha — Discover. Connect. Learn. Schedule a live 1-on-1 trial class for your child. Select your timezone, pick an available slot, and pair with an experienced educator." />
    <meta name="theme-color" content="#1E40AF" />
    <title>Anvesha | Discover. Connect. Learn.</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* ==========================================================================
         Anvesha Liquid Wave Preloader: Brand Color Matched & Anti-Blank Screen Guard
         ========================================================================== */
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background-color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        overflow: hidden;
        transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity;
      }

      #app-preloader.is-zoomed {
        opacity: 0;
        pointer-events: none;
      }

      /* Clean Card matching Anvesha EdTech Design System */
      .anv-video-card {
        position: relative;
        width: 90vw;
        max-width: 780px;
        aspect-ratio: 16 / 9.8;
        background: #ffffff;
        border-radius: 28px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 3rem;
        overflow: hidden;
      }

      /* Content Stage with Explosive Camera Zoom-Through */
      .anv-video-stage {
        width: 100%;
        max-width: 640px;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.85s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.75s cubic-bezier(0.19, 1, 0.22, 1), filter 0.75s ease;
        will-change: transform, opacity, filter;
      }

      .is-zoomed .anv-video-stage {
        transform: scale(7.2);
        opacity: 0;
        filter: blur(14px);
      }

      /* Liquid SVG Container */
      .anv-liquid-svg {
        width: 100%;
        height: auto;
        max-height: 220px;
        overflow: visible;
      }

      /* Dim base layer (light slate) */
      .anv-icon-dim {
        opacity: 0.22;
        filter: grayscale(100%) brightness(0.9);
      }

      .anv-text-dim {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 88px;
        font-weight: 900;
        letter-spacing: -0.025em;
        fill: #e2e8f0;
      }

      .anv-tagline-dim {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.28em;
        fill: #cbd5e1;
      }

      /* Luminous filled layer (Anvesha Brand Colors: Deep Royal Blue #1e40af & Orange #f97316) */
      .anv-icon-bright {
        filter: drop-shadow(0 6px 16px rgba(30, 64, 175, 0.22));
      }

      .anv-text-bright {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 88px;
        font-weight: 900;
        letter-spacing: -0.025em;
        fill: url(#anvBrandGradient);
        filter: drop-shadow(0 8px 24px rgba(30, 64, 175, 0.2));
      }

      .anv-tagline-bright {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.28em;
        fill: #ea580c;
      }

      /* Horizontal continuous wave movement */
      .anv-wave-motion {
        animation: anvWaveSlide 1.6s linear infinite;
      }

      @keyframes anvWaveSlide {
        from { transform: translateX(0); }
        to { transform: translateX(-300px); }
      }

      /* Loading counter in bottom right */
      .anv-counter-row {
        width: 100%;
        display: flex;
        justify-content: flex-end;
        margin-top: 1rem;
        padding-right: 1.25rem;
      }

      .anv-counter-text {
        font-size: 0.875rem;
        font-weight: 600;
        color: #64748b;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.03em;
      }

      /* Error recovery alert (if browser network ever halts) */
      .anv-error-recovery {
        display: none;
        margin-top: 0.75rem;
        align-items: center;
        gap: 0.5rem;
      }

      .anv-reload-btn {
        background: #1e40af;
        color: #ffffff;
        border: none;
        padding: 0.35rem 0.85rem;
        border-radius: 6px;
        font-size: 0.8125rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Brand-Matched Liquid Wave Preloader (Color-matched to Anvesha) -->
    <div id="app-preloader" aria-hidden="true">
      <div class="anv-video-card">
        <div class="anv-video-stage" id="anvStage">
          <svg viewBox="0 0 600 220" class="anv-liquid-svg">
            <defs>
              <!-- Anvesha Signature Brand Palette: Deep Royal Blue to Electric Azure to Radiant Orange -->
              <linearGradient id="anvBrandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#1e40af" />
                <stop offset="55%" stop-color="#2563eb" />
                <stop offset="100%" stop-color="#ea580c" />
              </linearGradient>

              <clipPath id="anvWaveClip">
                <!-- Group animated vertically from Y=230 (0%) to Y=-30 (100%) -->
                <g id="anvWaveGroup" transform="translate(0, 230)">
                  <path
                    class="anv-wave-motion"
                    d="M 0 0 Q 75 14, 150 0 T 300 0 T 450 0 T 600 0 T 750 0 T 900 0 V 360 H 0 Z"
                    fill="#1e40af"
                  />
                </g>
              </clipPath>
            </defs>

            <!-- Dim Base Layer (light slate) -->
            <g>
              <image href="/anvesha-icon.png" x="268" y="10" width="64" height="64" class="anv-icon-dim" />
              <text x="300" y="148" text-anchor="middle" dominant-baseline="middle" class="anv-text-dim">Anvesha</text>
              <text x="300" y="194" text-anchor="middle" dominant-baseline="middle" class="anv-tagline-dim">DISCOVER • CONNECT • LEARN</text>
            </g>

            <!-- Luminous Filled Layer (Brand Blue & Orange Gradient) -->
            <g clip-path="url(#anvWaveClip)">
              <image href="/anvesha-icon.png" x="268" y="10" width="64" height="64" class="anv-icon-bright" />
              <text x="300" y="148" text-anchor="middle" dominant-baseline="middle" class="anv-text-bright">Anvesha</text>
              <text x="300" y="194" text-anchor="middle" dominant-baseline="middle" class="anv-tagline-bright">DISCOVER • CONNECT • LEARN</text>
            </g>
          </svg>

          <!-- Counter in bottom right matching video: loading... XX % -->
          <div class="anv-counter-row">
            <span class="anv-counter-text" id="anvCounterLabel">loading... 1 %</span>
          </div>

          <div class="anv-error-recovery" id="anvErrorRecovery">
            <span style="font-size: 0.8125rem; color: #ef4444;">Connecting to application...</span>
            <button type="button" class="anv-reload-btn" onclick="window.location.reload(true)">Reload</button>
          </div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function() {
        var waveGroup = document.getElementById('anvWaveGroup');
        var counterLabel = document.getElementById('anvCounterLabel');
        var preloader = document.getElementById('app-preloader');
        if (!waveGroup || !counterLabel || !preloader) return;

        var startY = 230;
        var endY = -30;
        var totalDist = startY - endY;
        var duration = 2100; // 2.1s fill time
        var startTime = performance.now();

        function step(now) {
          var elapsed = now - startTime;
          var progress = Math.min(1, elapsed / duration);
          var percent = Math.min(100, Math.round(progress * 100));

          var currentY = startY - (progress * totalDist);
          waveGroup.setAttribute('transform', 'translate(0, ' + currentY + ')');
          counterLabel.textContent = 'loading... ' + percent + ' %';

          if (progress < 1) {
            requestAnimationFrame(step);
          } else {
            // Anti-Blank Screen Guard: Only dissolve when React has actually mounted into #root
            function finishReveal() {
              var isMounted = window.__ANVESHA_APP_MOUNTED__ || (document.getElementById('root') && document.getElementById('root').children.length > 0);
              if (isMounted) {
                setTimeout(function() {
                  preloader.classList.add('is-zoomed');
                  setTimeout(function() {
                    if (preloader && preloader.parentNode) preloader.remove();
                  }, 800);
                }, 180);
              } else {
                // Wait for React mount signal before opening the curtain
                setTimeout(finishReveal, 100);
              }
            }
            finishReveal();
          }
        }

        requestAnimationFrame(step);

        // Safety listener: if script error occurs, display reload button
        window.addEventListener('error', function() {
          var rec = document.getElementById('anvErrorRecovery');
          if (rec) rec.style.display = 'flex';
        });
      })();
    </script>
  </body>
</html>
